# Lint config for the whole repo (CI runs `ruff check .`).
#
# Deliberately starts with a small, bug-focused rule set that the codebase
# passes cleanly, so CI can enforce it from day one. Widen `select` (and
# drop entries from `ignore`) one rule at a time as the code is cleaned up.
target-version = "py311"
extend-exclude = ["hrm_tool/frontend_dist", "loans_tool/backend/data"]

[lint]
select = [
    "E9",  # syntax errors
    "F",   # pyflakes: undefined names, unused imports/variables, ...
    "B",   # bugbear: likely bugs
]
ignore = [
    "B008",  # call in default arg -- FastAPI's Depends()/Query() idiom
    "B904",  # raise ... from err -- TODO: enable
    "B905",  # zip(strict=) -- TODO: enable
    "B007",  # unused loop variable -- TODO: enable
]
