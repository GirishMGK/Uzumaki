name: Build Uzumaki.exe

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read  # this repo is private; releases publish elsewhere (see below), nothing here needs write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Stamp version (short commit SHA)
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "$SHA" > VERSION
          echo "$SHA" > version.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller Uzumaki.spec

      - name: Verify the exe was produced
        shell: bash
        run: test -f dist/Uzumaki.exe

      - name: Publish / update the rolling "latest" release
        # Published to a SEPARATE public repo (GirishMGK/Uzumaki-releases),
        # not this one -- this repo is private, and GitHub Release assets on
        # a private repo require an authenticated request to download, which
        # would mean Uzumaki.exe's self-updater needs an embedded credential
        # (a real leak risk -- see README). RELEASES_REPO_TOKEN is a
        # fine-grained PAT scoped to *only* Uzumaki-releases with
        # Contents: Read and write, stored as a secret on this repo; it
        # never leaves GitHub Actions and is never bundled into the .exe.
        uses: softprops/action-gh-release@v2
        with:
          repository: GirishMGK/Uzumaki-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: latest
          name: "Uzumaki (latest — ${{ steps.version.outputs.sha }})"
          body: |
            Auto-built from commit ${{ github.sha }}.
            This release is updated on every push to `main` — Uzumaki.exe
            checks it on launch and self-updates when a newer build exists.
          make_latest: true
          files: |
            dist/Uzumaki.exe
            version.txt
